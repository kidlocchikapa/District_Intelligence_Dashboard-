services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: district_intel_frontend
    depends_on:
      - backend
    environment:
      VITE_PROXY_TARGET: http://backend:5000
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "5173:5173"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    volumes:
      - frontend_node_modules:/app/node_modules
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/
            - dist/
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: district_intel_backend
    depends_on:
      - db
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET}
      ETL_PYTHON_PATH: python3
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_HOST: db
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      NODE_ENV: development
    volumes:
      - ./.env:/app/.env:ro
      - ./uploads:/app/uploads
      - backend_node_modules:/app/backend/node_modules
    command: ["sh", "-c", "cd /app/backend && npm run dev"]
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app/backend
          ignore:
            - node_modules/
        - action: sync
          path: ./etl
          target: /app/etl
          ignore:
            - venv/
            - __pycache__/
            - data/
        - action: sync
          path: ./database
          target: /app/database
        - action: sync
          path: ./sample_data
          target: /app/sample_data
        - action: rebuild
          path: ./backend/package.json
        - action: rebuild
          path: ./backend/package-lock.json
        - action: rebuild
          path: ./Dockerfile
        - action: rebuild
          path: ./etl/requirements.txt
    restart: unless-stopped

  db:
    image: postgis/postgis:15-3.3
    container_name: district_intel_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
  frontend_node_modules:
  backend_node_modules:
